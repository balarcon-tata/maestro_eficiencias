<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualizar Detalle Escaneos | TATA</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #090b0f;
      color: #f6f7fb;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      color: #aeb6c2;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      min-height: 46px;
      margin-top: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 10px 14px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, #b3202d, #ff4255);
      color: white;
      font-weight: 800;
      border: 0;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.07);
      color: #d9dee8;
      white-space: pre-wrap;
    }

    .ok { color: #9ff0c5; }
    .error { color: #ff9aa5; }
    .warn { color: #ffd68c; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Actualizar Detalle de Escaneos</h1>

    <p>
      Selecciona el archivo <strong>DETALLE ESCANEOS.xlsx</strong>.
      El sistema leerá el detalle completo, reemplazará la tabla anterior
      en Supabase y registrará la fecha de actualización.
    </p>

    <input type="file" id="excelFile" accept=".xlsx,.xls" />

    <button id="uploadBtn">
      Actualizar base de datos
    </button>

    <div id="lastUpdate" class="status">
      Última actualización: consultando...
    </div>

    <div id="status" class="status">
      Esperando archivo...
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://ezhlltgcqektrclgzhfi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QnmVt7kK6LTX6HqY3eJcUg_wTN-O6Hp";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const fileInput = document.getElementById("excelFile");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusBox = document.getElementById("status");
    const lastUpdateBox = document.getElementById("lastUpdate");

    const TABLA_DESTINO = "detalle_escaneos";
    const PROCESO_ACTUALIZACION = "DETALLE_ESCANEOS";

    function setStatus(message, type = "") {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    async function cargarUltimaActualizacion() {
      const { data, error } = await supabaseClient
        .from("control_actualizaciones")
        .select("fecha_actualizacion, registros")
        .eq("proceso", PROCESO_ACTUALIZACION)
        .maybeSingle();

      if (error) {
        lastUpdateBox.textContent = "Última actualización: no se pudo consultar.";
        return;
      }

      if (!data) {
        lastUpdateBox.textContent = "Última actualización: nunca";
        return;
      }

      const fecha = new Date(data.fecha_actualizacion).toLocaleString("es-GT");

      lastUpdateBox.textContent =
        `Última actualización: ${fecha}\nRegistros cargados: ${data.registros ?? "N/D"}`;
    }

    async function guardarRegistroActualizacion(registros) {
      const { error } = await supabaseClient
        .from("control_actualizaciones")
        .upsert({
          proceso: PROCESO_ACTUALIZACION,
          fecha_actualizacion: new Date().toISOString(),
          registros
        }, {
          onConflict: "proceso"
        });

      if (error) throw error;
    }

    function excelDateToISO(value) {
      if (value === undefined || value === null || value === "") return null;

      if (value instanceof Date) {
        return isNaN(value) ? null : value.toISOString();
      }

      if (typeof value === "number") {
        const date = XLSX.SSF.parse_date_code(value);
        if (!date) return null;

        const jsDate = new Date(
          Date.UTC(
            date.y,
            date.m - 1,
            date.d,
            date.H || 0,
            date.M || 0,
            Math.floor(date.S || 0)
          )
        );

        return jsDate.toISOString();
      }

      const parsed = new Date(value);
      if (!isNaN(parsed)) return parsed.toISOString();

      return null;
    }

    function cleanNumber(value) {
      if (value === undefined || value === null || value === "") return null;

      if (typeof value === "number") return value;

      const cleaned = String(value)
        .replace(/,/g, ".")
        .trim();

      const number = Number(cleaned);
      return isNaN(number) ? null : number;
    }

    function cleanInteger(value) {
      const number = cleanNumber(value);
      return number === null ? null : Math.trunc(number);
    }

    function cleanText(value) {
      if (value === undefined || value === null) return null;
      const text = String(value).trim();
      return text === "" ? null : text;
    }

    function normalizeHeader(header) {
      return String(header || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function getValue(row, possibleHeaders) {
      const normalizedMap = {};

      Object.keys(row).forEach(key => {
        normalizedMap[normalizeHeader(key)] = row[key];
      });

      for (const header of possibleHeaders) {
        const normalized = normalizeHeader(header);
        if (Object.prototype.hasOwnProperty.call(normalizedMap, normalized)) {
          return normalizedMap[normalized];
        }
      }

      return null;
    }

    function chunkArray(array, size) {
      const chunks = [];

      for (let i = 0; i < array.length; i += size) {
        chunks.push(array.slice(i, i + size));
      }

      return chunks;
    }

    uploadBtn.addEventListener("click", async () => {
      try {
        const file = fileInput.files[0];

        if (!file) {
          setStatus("Selecciona primero el archivo Excel.", "warn");
          return;
        }

        uploadBtn.disabled = true;
        setStatus("Leyendo archivo Excel...");

        const arrayBuffer = await file.arrayBuffer();

        const workbook = XLSX.read(arrayBuffer, {
          type: "array",
          cellDates: true
        });

        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        const rows = XLSX.utils.sheet_to_json(sheet, {
          defval: null
        });

        if (!rows.length) {
          throw new Error("No se encontraron datos en la primera hoja del archivo.");
        }

        setStatus(`Archivo leído correctamente.\nFilas detectadas: ${rows.length}\nPreparando registros...`);

        const archivoOrigen = file.name;

        const registros = rows
          .map(row => ({
            qr: cleanText(getValue(row, ["QR"])),
            prefijo: cleanText(getValue(row, ["Prefijo"])),
            orden: cleanText(getValue(row, ["Orden"])),
            estilo: cleanText(getValue(row, ["Estilo"])),
            talla: cleanText(getValue(row, ["Talla"])),
            fecha_escaneo: excelDateToISO(getValue(row, ["Fecha Escaneo", "Fecha de Escaneo"])),
            etapa: cleanText(getValue(row, ["Etapa"])),
            linea: cleanText(getValue(row, ["Línea", "Linea"])),
            id_operacion: cleanInteger(getValue(row, ["ID Operación", "ID Operacion"])),
            operacion: cleanText(getValue(row, ["Operación", "Operacion"])),
            tipo_marca: cleanText(getValue(row, ["Tipo Marca"])),
            cod_operativo: cleanText(getValue(row, ["Cod Operativo", "Código Operativo", "Codigo Operativo"])),
            operativo: cleanText(getValue(row, ["Operativo"])),
            cantidad: cleanNumber(getValue(row, ["Cantidad"])),
            archivo_origen: archivoOrigen
          }))
          .filter(row =>
            row.qr !== null ||
            row.orden !== null ||
            row.estilo !== null ||
            row.operacion !== null ||
            row.operativo !== null
          );

        if (!registros.length) {
          throw new Error("No se generaron registros válidos para insertar.");
        }

        setStatus(`Registros preparados: ${registros.length}\nEliminando datos anteriores de ${TABLA_DESTINO}...`);

        const { error: deleteError } = await supabaseClient
          .from(TABLA_DESTINO)
          .delete()
          .neq("id", 0);

        if (deleteError) throw deleteError;

        const chunks = chunkArray(registros, 500);

        for (let i = 0; i < chunks.length; i++) {
          setStatus(
            `Insertando datos en Supabase...\nBloque ${i + 1} de ${chunks.length}\nRegistros totales: ${registros.length}`
          );

          const { error: insertError } = await supabaseClient
            .from(TABLA_DESTINO)
            .insert(chunks[i]);

          if (insertError) throw insertError;
        }

        await guardarRegistroActualizacion(registros.length);
        await cargarUltimaActualizacion();

        setStatus(
          `Actualización completada correctamente.\n\nRegistros cargados: ${registros.length}\nHoja procesada: ${sheetName}\nArchivo origen: ${archivoOrigen}`,
          "ok"
        );

      } catch (error) {
        console.error(error);
        setStatus(
          "Error al actualizar la base de datos:\n\n" + error.message,
          "error"
        );
      } finally {
        uploadBtn.disabled = false;
      }
    });

    cargarUltimaActualizacion();
  </script>
</body>
</html>
